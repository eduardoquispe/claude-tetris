<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section theme-toggle-section">
          <span class="label">THEME</span>
          <label class="theme-toggle" title="Cambiar tema">
            <input type="checkbox" id="theme-toggle" />
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-icon" id="theme-icon">☀️</span>
          </label>
        </div>

        <div class="panel-section theme-selector">
          <span class="label">Tema</span>
          <div class="theme-buttons">
            <button class="theme-btn active" data-theme="retro">Retro</button>
            <button class="theme-btn" data-theme="neon">Neon</button>
            <button class="theme-btn" data-theme="pastel">Pastel</button>
            <button class="theme-btn" data-theme="pixel">Pixel</button>
          </div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="name-input-section" class="hidden">
          <p>¡Entraste al top 5!</p>
          <input type="text" id="player-name" placeholder="Tu nombre" maxlength="20" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <div id="scores-container"></div>
        <button id="reset-scores-btn">Resetear records</button>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="pause-overlay hidden">
      <div class="pause-box">
        <p class="pause-title">PAUSA</p>
        <div class="pause-buttons">
          <button id="resume-btn">Reanudar</button>
          <button id="pause-restart-btn">Reiniciar</button>
        </div>
        <div class="pause-controls">
          <span class="pause-controls-label">CONTROLES</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> Mover</li>
            <li><kbd>↑</kbd><kbd>X</kbd> Rotar</li>
            <li><kbd>↓</kbd> Bajar</li>
            <li><kbd>Space</kbd> Hard Drop</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> Pausa</li>
          </ul>
        </div>
        <div class="pause-level-select">
          <label for="start-level-select" class="pause-controls-label">NIVEL INICIAL (próxima partida)</label>
          <select id="start-level-select"></select>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
