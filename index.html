<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section theme-toggle-section">
          <span class="label">THEME</span>
          <label class="theme-toggle" title="Cambiar tema">
            <input type="checkbox" id="theme-toggle" />
            <span class="toggle-track">
              <span class="toggle-thumb"></span>
            </span>
            <span class="toggle-icon" id="theme-icon">☀️</span>
          </label>
        </div>
      </aside>
    </div>

    <div id="pause-overlay" class="pause-overlay hidden">
      <h2 class="pause-title">PAUSA</h2>
      <div class="pause-buttons">
        <button id="resume-btn">&#9654; Reanudar</button>
        <button id="pause-restart-btn">&#8635; Reiniciar</button>
      </div>
      <div class="pause-controls">
        <h3>Controles</h3>
        <table class="controls-table">
          <tr><td><kbd>&#8592; &#8594;</kbd></td><td>Mover</td></tr>
          <tr><td><kbd>&#8593;</kbd> / <kbd>X</kbd></td><td>Rotar</td></tr>
          <tr><td><kbd>&#8595;</kbd></td><td>Bajar</td></tr>
          <tr><td><kbd>Espacio</kbd></td><td>Hard drop</td></tr>
          <tr><td><kbd>P</kbd> / <kbd>Esc</kbd></td><td>Pausa</td></tr>
        </table>
      </div>
      <div class="pause-level">
        <label for="start-level-select">Nivel inicial:</label>
        <select id="start-level-select"></select>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
